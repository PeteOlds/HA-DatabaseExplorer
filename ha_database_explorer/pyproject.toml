[project]
name = "ha-database-explorer"
version = "0.1.0"
description = "Home Assistant multi-database analytics explorer (SQLite, MariaDB/MySQL, InfluxDB 1.8)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "httpx>=0.27",
    "aiodocker>=0.21",
    "cryptography>=42.0",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "ruamel.yaml>=0.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
