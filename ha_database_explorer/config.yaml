name: HA Database Explorer
version: "0.2.1"
slug: ha_database_explorer
description: >-
  Audit storage, retention and cross-database entity overlap across your Home Assistant
  databases (SQLite, MariaDB/MySQL, InfluxDB 1.8). Privacy-first, local-only.
url: https://github.com/PeteOlds/HA-DatabaseExplorer
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:database-search
panel_title: Database Explorer
hassio_api: true
homeassistant_api: false
# Privileged mode is REQUIRED for Docker-socket auto-detection of database containers.
protection_mode: false
privileged:
  - NET_ADMIN
map:
  - addon_config
  - homeassistant_config
  - ssl
options:
  log_level: info
  # CRON expression for the scheduled deep scan (HA local time). Default 03:30 daily.
  scan_cron: "30 3 * * *"
  # Manual size entry (MB) used when a database exposes no disk-size API (e.g. InfluxDB
  # without socket access). JSON object keyed by connection_name, e.g.
  # {"Main MariaDB Recorder": 512}.
  manual_sizes: "{}"
schema:
  log_level: list(info|debug|warning|error)
  scan_cron: str
  manual_sizes: str?
